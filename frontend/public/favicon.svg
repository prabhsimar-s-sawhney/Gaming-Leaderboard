<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#gameGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Trophy cup -->
  <path d="M35 35 L65 35 L65 45 L62 45 L62 55 L60 60 L40 60 L38 55 L38 45 L35 45 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Trophy handles -->
  <path d="M35 40 Q30 40 30 45 Q30 50 35 50" fill="none" stroke="#FFD700" stroke-width="2"/>
  <path d="M65 40 Q70 40 70 45 Q70 50 65 50" fill="none" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Trophy base -->
  <rect x="42" y="60" width="16" height="8" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  <rect x="40" y="68" width="20" height="4" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Number 1 in trophy -->
  <text x="50" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B5CF6">1</text>
  
  <!-- Gaming controller elements -->
  <circle cx="25" cy="75" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="75" cy="75" r="3" fill="#ffffff" opacity="0.8"/>
  <rect x="48" y="73" width="4" height="4" fill="#ffffff" opacity="0.8"/>
</svg>
